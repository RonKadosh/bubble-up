server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # WebSocket is long-lived; nginx's default 60s proxy_read_timeout would drop an
        # idle connection and cause reconnect storms. Server-side STOMP heartbeats (10s,
        # see WebSocketConfig) keep it alive; this is the safety margin on top.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # nginx's bundled mime.types has no .mjs mapping, so ES-module assets fall back
    # to application/octet-stream — which browsers reject for module scripts (e.g.
    # the pdf.js worker, loaded as a module worker by react-pdf). Serve .mjs as JS.
    # (Done via default_type in a dedicated location, not a types{} block: the
    # mime.types file is itself a types{} block and would nest if re-included here.)
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
