# Preserve the protocol the original client used. In prod, Caddy terminates
# TLS and forwards X-Forwarded-Proto: https — but the Caddy->nginx hop itself
# is plain http, so using $scheme here would *downgrade* the forwarded proto
# to http. Spring then builds the OAuth redirect_uri as
# http://bubbleup.online/... and Google rejects it (redirect_uri_mismatch).
# Trust the upstream header when present; fall back to $scheme when nginx is
# the outermost proxy (local docker-compose without Caddy).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Same trust-the-outermost-proxy logic for the host. Spring's
# ForwardedHeaderFilter resets the port to the scheme default whenever any
# X-Forwarded-* header is present, so sending X-Forwarded-Proto WITHOUT
# X-Forwarded-Host silently drops ":3000" from the dev origin and Google
# rejects the portless redirect_uri (redirect_uri_mismatch). $http_host
# keeps the port; an upstream (Caddy) value wins when present.
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;

    # nginx defaults client_max_body_size to 1 MB, which silently 413s any
    # upload larger than that BEFORE it reaches the backend. The app allows
    # 5 MB avatars (AvatarTypeFilter) and up to 26 MB group-file requests
    # (Spring multipart max-request-size). Match the larger so nginx never
    # rejects a request the backend would have accepted.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Google OAuth2 entry point and callback. Spring Security publishes
    # /oauth2/authorization/google (entry) and /login/oauth2/code/google
    # (callback). The user's browser is redirected to these directly —
    # they can't be axios-proxied via /api/.
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        # Preserve the incoming host *with port* so Spring builds the OAuth
        # redirect_uri against the public dev origin (e.g. localhost:3000),
        # not a portless "localhost" URL that Google rejects.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /login/oauth2/ {
        proxy_pass http://backend:8080/login/oauth2/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # WebSocket is long-lived; nginx's default 60s proxy_read_timeout would drop an
        # idle connection and cause reconnect storms. Server-side STOMP heartbeats (10s,
        # see WebSocketConfig) keep it alive; this is the safety margin on top.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # nginx's bundled mime.types has no .mjs mapping, so ES-module assets fall back
    # to application/octet-stream — which browsers reject for module scripts (e.g.
    # the pdf.js worker, loaded as a module worker by react-pdf). Serve .mjs as JS.
    # (Done via default_type in a dedicated location, not a types{} block: the
    # mime.types file is itself a types{} block and would nest if re-included here.)
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
