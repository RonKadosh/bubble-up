services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bubbleup
      POSTGRES_USER: bubbleup
      POSTGRES_PASSWORD: bubbleup
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubbleup"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bubbleup-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bubbleup
      DB_USERNAME: bubbleup
      DB_PASSWORD: bubbleup
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-create-drop}
      JWT_SECRET: bubbleup-dev-secret-key-change-this-in-production-must-be-at-least-256-bits
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FILE_STORAGE_TYPE: local
      FILE_STORAGE_LOCAL_PATH: /tmp/bubbleup-files
      # JaaS (Jitsi-as-a-Service) credentials. Empty = JITSI_NOT_CONFIGURED at room access time.
      # Get these from https://jaas.8x8.vc — keep the private key out of git.
      APP_JITSI_APP_ID: ${APP_JITSI_APP_ID:-}
      APP_JITSI_KID: ${APP_JITSI_KID:-}
      APP_JITSI_PRIVATE_KEY_PEM: ${APP_JITSI_PRIVATE_KEY_PEM:-}
      # Default ON for docker-compose so first-run users see demo bubbles immediately.
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-true}
      # Optional Help Center AI assistant (OpenAI). Defaults OFF; local catalog still works.
      APP_HELP_AI_ENABLED: ${APP_HELP_AI_ENABLED:-false}
      APP_HELP_AI_PROVIDER: ${APP_HELP_AI_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      APP_HELP_AI_MODEL: ${APP_HELP_AI_MODEL:-gpt-5-nano}
      APP_HELP_AI_TIMEOUT: ${APP_HELP_AI_TIMEOUT:-PT20S}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bubbleup-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bubbleup-network

volumes:
  postgres_data:

networks:
  bubbleup-network:
    driver: bridge
