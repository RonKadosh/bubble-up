spring:
  # OAuth2 client auto-config tries to validate the Google issuer-uri at
  # context boot — that's a live HTTPS call to accounts.google.com which is
  # both unreliable and unwanted in tests. Tests that need OAuth2 wiring
  # (none today) can re-enable it explicitly via @TestPropertySource.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
  datasource:
    url: jdbc:h2:mem:bubbleup_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 26MB

app:
  security:
    jwt-secret: test-secret-key-deterministic-must-be-at-least-256-bits-aaaaaaaaaaaaa
    jwt-access-expiration-ms: 900000
    refresh-token-expiration-ms: 2592000000
  cors:
    allowed-origins: http://localhost:3000
  # Rate limiting OFF by default in tests so the suite isn't throttled by the
  # production caps. RateLimitIT opts in via @TestPropertySource to verify enforcement.
  rate-limit:
    enabled: false
  file-storage:
    type: local
    local-path: /tmp/bubbleup-test-files
  # Existing expert tests assume instant verification on apply. The runtime
  # default is now false (admin-gated); pin true here so the suite keeps its
  # apply->VERIFIED assumption. ExpertVerificationGatingIT opts back into
  # false via @TestPropertySource to cover the gated path.
  expert:
    auto-verify: true
  simulation:
    enabled: false
  agents:
    enabled: false
  help:
    ai:
      enabled: false
      provider: openai
      base-url: https://api.openai.com/v1
      api-key:
      model: gpt-5-nano
      timeout: PT20S
  # Tests own their data — keep dev seeders OFF regardless of their (now ON) dev defaults,
  # so seeded demo/scenario bubbles don't pollute the shared in-memory test DB.
  demo:
    seed:
      enabled: false
  matching:
    scenario:
      seed:
        enabled: false
