spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bubbleup}
    username: ${DB_USERNAME:bubbleup}
    password: ${DB_PASSWORD:bubbleup}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET:bubbleup-dev-secret-key-change-this-in-production-must-be-at-least-256-bits}
    jwt-access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    # Master switch for @RateLimit enforcement. Per-endpoint limits live in the
    # annotations; this only turns the whole mechanism on/off (emergency escape hatch).
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    local-path: ${FILE_STORAGE_LOCAL_PATH:/tmp/bubbleup-files}
  jitsi:
    # JaaS (8x8.vc) credentials. Without these, room access throws JITSI_NOT_CONFIGURED.
    # Set via env in prod; keep the private key OUT of source control.
    app-id: ${APP_JITSI_APP_ID:}
    kid: ${APP_JITSI_KID:}
    private-key-pem: ${APP_JITSI_PRIVATE_KEY_PEM:}
    server-url: ${APP_JITSI_SERVER_URL:https://8x8.vc}
    token-ttl: ${APP_JITSI_TOKEN_TTL:PT2H}
  demo:
    seed:
      # Boots 10 demo users + Study Bubbles on first start. Idempotent.
      # Temporarily ON by default while iterating; turn off in any env that
      # should not have shared credentials.
      enabled: ${APP_DEMO_SEED_ENABLED:true}
  simulation:
    enabled: false
  agents:
    enabled: false
  expert:
    # When true, expert applicants are auto-verified on apply. Default is now
    # false: applying creates a PENDING request, promoted to EXPERT only on
    # admin approval via the admin Expert Requests inbox.
    auto-verify: ${APP_EXPERT_AUTO_VERIFY:false}
  matching:
    quiz-question-cap: 12
    recommendation-limit: 5
    candidate-limit-per-course: 200
    weight-shift-day-start: 5
    weight-shift-day-end: 14
    quiz-weight-max: 0.70
    quiz-weight-min: 0.20
    # Minimum gap between consecutive quiz prompts to a single user. ISO-8601 duration.
    # PT30S for quick demos; PT10M is the dev default; raise toward PT2H+ for production cadence.
    quiz-cooldown: ${APP_MATCHING_QUIZ_COOLDOWN:PT10M}
    # matching_confidence (= user_confidence × group_profile_confidence) at/above this
    # renders a bubble as MATCHED (shows %); below it renders as TRENDING (reason labels).
    matched-display-threshold: ${APP_MATCHING_MATCHED_THRESHOLD:0.30}
    confidence:
      question-cap: 7              # answered questions for full question-confidence
      behavior-evidence-cap: 3.0   # saturated behavior-evidence units (Σ count/(count+k)) for full
                                   # behavior-confidence — needs a SPREAD of distinct actions, not volume
      question-weight: 0.70
      behavior-weight: 0.30
      user-cap: 1.0
      group-member-cap: 5    # members for the group-confidence size factor to saturate
    trending:
      activity-weight: 0.35
      recent-join-weight: 0.30
      member-count-weight: 0.20
      upcoming-weight: 0.15
      activity-window-days: ${APP_MATCHING_TRENDING_ACTIVITY_WINDOW_DAYS:14}
      recent-join-window-days: ${APP_MATCHING_TRENDING_JOIN_WINDOW_DAYS:14}
      upcoming-window-days: ${APP_MATCHING_TRENDING_UPCOMING_WINDOW_DAYS:30}
      activity-cap: 50       # msgs+files in window that saturate the activity signal
      recent-join-cap: 5
      member-count-cap: 10
      upcoming-cap: 5
    # Per-action behavior signals. Each action contributes weight*(count/(count+k)) to its
    # role(s); the per-role sums are then max-normalized to a shape (MatchingScorer.behaviorVector).
    # k = half-saturation count: large for frequent actions (chat) so volume can't dominate the
    # shape; small (=1) for rare high-intent acts so one occurrence already signals. Adding an
    # action = new BehaviorEventType + a publish site + one entry here. role weights need not sum to 1.
    signals:
      CREATED_GROUP:          { k: 1, roles: { leader: 1.0 } }
      ADDED_MEMBER:           { k: 3, roles: { leader: 0.5 } }
      JOINED_GROUP:           { k: 4, roles: { teamPlayer: 0.2 } }
      CREATED_CALENDAR_EVENT: { k: 2, roles: { planner: 1.0 } }
      UPLOADED_FILE:          { k: 3, roles: { expert: 0.8 } }
      SENT_MESSAGE:           { k: 8, roles: { communicator: 0.4 } }
      PINNED_MESSAGE:         { k: 3, roles: { planner: 0.3, leader: 0.2 } }
      CREATED_POLL:           { k: 2, roles: { leader: 0.5, planner: 0.5 } }
      VOTED_IN_POLL:          { k: 6, roles: { teamPlayer: 0.4 } }
      CLOSED_POLL:            { k: 2, roles: { leader: 0.4 } }
      CREATED_FOLDER:         { k: 2, roles: { planner: 0.5 } }
      SUBMITTED_REPORT:       { k: 2, roles: { challenger: 0.5 } }
      PUBLISHED_WHITEBOARD:   { k: 8, roles: { creative: 0.6 } }
      APPLIED_AS_EXPERT:      { k: 1, roles: { expert: 0.8 } }
      BOOKED_EXPERT:          { k: 2, roles: { leader: 0.4 } }
      CREATED_EXPERT_SESSION: { k: 1, roles: { expert: 0.7, leader: 0.3 } }
    scenario:
      seed:
        # Seeds end-to-end matching scenarios (cold/cold, complementary, duplicate,
        # untrusted group, cold user, trending order) for manual browser E2E.
        # Temporarily ON by default while iterating on matching v1.
        enabled: ${APP_MATCHING_SCENARIO_SEED_ENABLED:true}
